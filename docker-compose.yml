services:
  streamcap:
    # 1. 使用本地构建，不再直接拉取镜像
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUID=${CURRENT_UID:-1000}
        - PGID=${CURRENT_GID:-1000}
        - http_proxy=http://192.168.50.66:7890
        - https_proxy=http://192.168.50.66:7890
        - no_proxy=localhost,127.0.0.1
    tty: true
    ports:
      - "${PORT:-6006}:${PORT:-6006}"
    environment:
      - PORT=${PORT:-6006}
      - TZ=${TZ:-Asia/Shanghai}
      - STREAMCAP_REMOTE_ENABLED=${STREAMCAP_REMOTE_ENABLED:-false}
      - STREAMCAP_REMOTE_URL=${STREAMCAP_REMOTE_URL:-https://streamcap.jp.insolitude.me}
      - STREAMCAP_API_KEY=${STREAMCAP_API_KEY:-}
      - STREAMCAP_REMOTE_AUTO_DOWNLOAD=${STREAMCAP_REMOTE_AUTO_DOWNLOAD:-true}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - /media/iso/hdd3/steamcap/:/app/downloads
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${PORT:-6006}/about"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - streamcap-network

  video_api:
    # 同样使用构建模式，共享同一套构建代码，但运行不同的命令
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUID=${CURRENT_UID:-1000}
        - PGID=${CURRENT_GID:-1000}
        - http_proxy=http://192.168.50.66:7890
        - https_proxy=http://192.168.50.66:7890
        - no_proxy=localhost,127.0.0.1
    command: python -m app.api.video_stream_service
    ports:
      - "${VIDEO_API_PORT:-6007}:${VIDEO_API_PORT:-6007}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CUSTOM_VIDEO_ROOT_DIR=${CUSTOM_VIDEO_ROOT_DIR:-./downloads}
    volumes:
      - /media/iso/hdd3/steamcap/:/app/downloads
      - ./.env:/app/.env
    depends_on:
      - streamcap
    networks:
      - streamcap-network

  remote_recorder:
    profiles: ["headless"]
    build:
      context: .
      dockerfile: Dockerfile
      target: headless
      args:
        - PUID=${CURRENT_UID:-1000}
        - PGID=${CURRENT_GID:-1000}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - no_proxy=${no_proxy:-localhost,127.0.0.1}
    ports:
      - "${STREAMCAP_PORT:-8000}:${STREAMCAP_PORT:-8000}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - STREAMCAP_API_KEY=${STREAMCAP_API_KEY:-}
      - STREAMCAP_MAX_STORAGE_BYTES=${STREAMCAP_MAX_STORAGE_BYTES:-10737418240}
      - STREAMCAP_MIN_FREE_BYTES=${STREAMCAP_MIN_FREE_BYTES:-3221225472}
      - STREAMCAP_RETENTION_SECONDS=${STREAMCAP_RETENTION_SECONDS:-86400}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - /media/iso/hdd3/steamcap/remote_tasks:/app/downloads/remote_tasks
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${STREAMCAP_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - streamcap-network

networks:
  streamcap-network:
    driver: bridge